version: '3.9'

services:
  redis:
    image: redis:alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - rede-distribuida

  app:
    build: .
    container_name: app-flask
    ports:
      - "5000:5050"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - rede-distribuida

volumes:
  redis-data:

networks:
  rede-distribuida: